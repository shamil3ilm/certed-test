name: CI

# Runs the same static gates a developer runs locally, on every push and PR.
# The document-management refactor once landed a tree that did not type-check
# (37 errors) and shipped a red test file; `typecheck` + `test` here are exactly
# the gates that would have caught it before merge.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the in-flight run - no point finishing CI
# for a commit that's already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two migrations sharing a version prefix is a silent data-integrity bug:
      # Supabase records the version once and skips the rest, so a migration can
      # look applied while never running. This has recurred (0034->0041, then
      # 0047x2); catch it in CI instead. Pure bash - runs before the slow steps.
      - name: Migration hygiene (unique version prefixes)
        run: |
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version prefix(es): $dupes"
            echo "Two migrations share a number; Supabase records the version once and silently skips the rest. Renumber the later one."
            exit 1
          fi
          echo "Migration version prefixes are unique."

      # The rebuild snapshot is a pg_dump regenerated from a live DB
      # (npm run db:rebuild-snapshot). Now that it is in sync with the chain, this
      # is a HARD gate: adding a migration without regenerating the snapshot fails
      # CI, so the one-shot provisioning file can never silently drift from the
      # chain again (the drift that let a snapshot-built env miss later behaviour).
      # Single source of truth for the check, shared with the local pre-push hook
      # (.githooks/pre-push) so CI and authoring-time verdicts can never diverge.
      - name: Rebuild snapshot freshness (must match chain head)
        run: bash scripts/check-snapshot-freshness.sh

      # A broken cross-doc link is invisible until someone clicks it. Cheap pure-bash
      # gate over the living docs (qa/ and archive/ snapshots excluded). Shared with
      # the pre-push hook so CI and authoring-time verdicts can't diverge.
      - name: Documentation links resolve
        run: bash scripts/check-doc-links.sh

      # Git silently skips a non-executable hook on Unix, so a hook committed 100644
      # never runs and its guard becomes a no-op. Assert the exec bit here,
      # where hooks don't run anyway - the one place that catches a birth-defect hook.
      - name: Git hooks are executable
        run: bash scripts/check-hooks-executable.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-to-catch first so an obvious failure fails fast.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (with coverage threshold)
        run: npm run test:coverage

      # A green typecheck doesn't prove the app builds - route data collection,
      # prerendering, and the build-env validator only run here. Dummy public
      # env lets the client vars inline without contacting Supabase (the build
      # never connects); real secrets are not needed to compile.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key

      # Ratchet on first-load JS: fail if the gzipped shared bundle every page
      # loads exceeds the budget, so per-page-load weight can't creep up (e.g. an
      # SDK imported unconditionally instead of code-split). Runs after Build.
      - name: First-load bundle budget
        run: npm run check:bundle

  # E2E gate. globalSetup resets .mock-db.json and the webServer builds + starts the
  # mock app on :3100, so the whole suite runs deterministically. responsive.pw.ts
  # checks each persona's pages for horizontal overflow at narrow widths.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test --project=chromium
      # A CI-only failure is otherwise diagnosed from a single assertion line; the
      # HTML report + per-test traces/screenshots/error-context.md make it readable.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # RLS is the one correctness class mock mode cannot verify (the mock has no RLS),
  # so the policies are asserted against REAL Postgres here: apply the whole migration
  # chain to an empty DB, seed a Supabase-shaped auth context, and check every read
  # returns exactly the rows each persona should see. Pure psql - no Node needed.
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        # test-rls.sh connects as `postgres` with an empty password; trust auth lets
        # it in without a secret, which is fine for a throwaway CI database.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # The runner already ships psql; install only if a future image drops it.
      - name: Ensure psql client
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: RLS policy assertions (real Postgres)
        run: bash scripts/test-rls.sh
